<ul class="social-media-list">
  {%- if site.linkedin_username -%}
  <li>
    <a href="https://www.linkedin.com/in/{{ site.linkedin_username | cgi_escape | escape }}">
      <span class="social-icon linkedin-icon" aria-hidden="true">in</span>
      <span>LinkedIn</span>
    </a>
  </li>
  {%- endif -%}
  {%- if site.substack_url -%}
  <li>
    <a href="{{ site.substack_url | escape }}">
      <span class="social-icon substack-icon" aria-hidden="true">S</span>
      <span>Substack</span>
    </a>
  </li>
  {%- endif -%}
</ul>
